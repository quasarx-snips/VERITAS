<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERITAS - Team KompilerZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* NIGHT THEME DEFAULT BACKGROUND */
    body {
      background-color: #070d10;
      background-image: radial-gradient(circle at 50% 40%, #163a48 0%, #0a1c24 45%, #030608 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      /* Only transition colors on body to avoid jank. Gradients are handled by overlay. */
      transition: color 0.6s ease, background-color 0.6s ease;
    }

    body.day-mode {
      color: #0f172a;
    }

    /* Smooth Day Mode Gradient Overlay */
    .day-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #52bcf8;
      background-image: linear-gradient(
        180deg, 
        #52bcf8 0%, 
        #bfe8ff 25%, 
        #ffffff 48%, 
        #ffffff 52%, 
        #fff59d 78%, 
        #ffeb3b 100%
      );
      opacity: 0;
      z-index: 0; /* Behind everything */
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    body.day-mode .day-bg-overlay {
      opacity: 1;
    }

    .stars-layer, .stars-layer-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.6s ease;
      /* GPU Acceleration for scale/opacity animations */
      will-change: opacity, transform; 
    }

    body.day-mode .stars-layer,
    body.day-mode .stars-layer-2 {
      opacity: 0;
    }

    .stars-layer {
      background-image: 
        radial-gradient(1.5px 1.5px at 10% 15%, rgba(255, 255, 255, 1), transparent),
        radial-gradient(2px 2px at 20% 35%, rgba(0, 255, 163, 1), transparent),
        radial-gradient(1px 1px at 30% 70%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(1.5px 1.5px at 35% 12%, rgba(255, 255, 255, 1), transparent),
        radial-gradient(2.5px 2.5px at 45% 65%, rgba(0, 255, 163, 1), transparent),
        radial-gradient(1px 1px at 50% 20%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(2.5px 2.5px at 60% 25%, rgba(0, 255, 163, 1), transparent),
        radial-gradient(1px 1px at 68% 85%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(1.5px 1.5px at 70% 80%, rgba(255, 255, 255, 1), transparent),
        radial-gradient(2px 2px at 80% 40%, rgba(0, 255, 163, 0.9), transparent),
        radial-gradient(2px 2px at 85% 18%, rgba(255, 255, 255, 1), transparent),
        radial-gradient(1.5px 1.5px at 92% 55%, rgba(255, 255, 255, 0.9), transparent);
      animation: shimmer 2.4s infinite alternate ease-in-out;
    }

    .stars-layer-2 {
      background-image: 
        radial-gradient(2px 2px at 5% 45%, rgba(0, 255, 163, 1), transparent),
        radial-gradient(1.5px 1.5px at 15% 75%, rgba(255, 255, 255, 0.95), transparent),
        radial-gradient(2.5px 2.5px at 25% 20%, rgba(56, 189, 248, 1), transparent),
        radial-gradient(1px 1px at 38% 85%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(2.5px 2.5px at 48% 35%, rgba(0, 255, 163, 1), transparent),
        radial-gradient(1.5px 1.5px at 55% 75%, rgba(255, 255, 255, 1), transparent),
        radial-gradient(2px 2px at 65% 50%, rgba(56, 189, 248, 0.9), transparent),
        radial-gradient(1.5px 1.5px at 75% 15%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(2.5px 2.5px at 82% 70%, rgba(0, 255, 163, 1), transparent),
        radial-gradient(1.5px 1.5px at 88% 30%, rgba(255, 255, 255, 1), transparent),
        radial-gradient(2px 2px at 95% 80%, rgba(56, 189, 248, 0.95), transparent);
      animation: shimmer2 3.2s infinite alternate ease-in-out 0.8s;
    }

    /* Translate3d pushes rendering to the GPU for ultra-smooth scaling */
    @keyframes shimmer {
      0% { opacity: 0.2; transform: scale(0.97) translate3d(0,0,0); }
      50% { opacity: 1; transform: scale(1.02) translate3d(0,0,0); }
      100% { opacity: 0.35; transform: scale(1) translate3d(0,0,0); }
    }

    @keyframes shimmer2 {
      0% { opacity: 0.15; transform: scale(1.01) translate3d(0,0,0); }
      50% { opacity: 0.95; transform: scale(0.98) translate3d(0,0,0); }
      100% { opacity: 0.25; transform: scale(1.01) translate3d(0,0,0); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 36px 0 36px;
      width: 100%;
      height: 55px;
      z-index: 10;
      position: relative;
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      color: #00ffa3;
      font-weight: 900;
      font-size: 21px;
      font-family: monospace;
      text-shadow: none;
      transition: color 0.4s ease;
    }

    body.day-mode .brand-icon {
      color: #0f172a;
    }

    .brand-text h2 {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.2px;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    body.day-mode .brand-text h2 {
      color: #0f172a;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .brand-text p {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      margin-top: 1px;
      transition: color 0.4s ease;
    }

    body.day-mode .brand-text p {
      color: #0369a1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .day-night-toggle {
      display: flex;
      background: rgba(13, 25, 32, 0.9);
      border: 1px solid #1e3540;
      border-radius: 12px;
      padding: 3px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.day-mode .day-night-toggle {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }

    .toggle-opt {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-weight: 800;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toggle-opt.active {
      background: #00ffa3;
      color: #031711;
      box-shadow: none;
    }

    body.day-mode .toggle-opt {
      color: #0284c7;
    }

    body.day-mode .toggle-opt.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
    }

    .menu-wrapper {
      position: relative;
      width: 160px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      background: rgba(13, 25, 32, 0.9);
      border: 1px solid #1e3540;
      border-radius: 12px;
      padding: 6px 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s ease, background 0.4s ease, box-shadow 0.4s ease;
    }

    body.day-mode .menu-button {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }

    .menu-button span {
      font-weight: 800;
      font-size: 15px;
      color: #ffffff;
      transition: color 0.4s ease;
    }

    body.day-mode .menu-button span {
      color: #0f172a;
    }

    .cat-avatar {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #00ffa3, #0284c7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: none;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    body.day-mode .cat-avatar {
      background: linear-gradient(135deg, #0284c7, #eab308);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      margin-top: 6px;
      background: rgba(10, 20, 26, 0.95);
      border: 1px solid #1e3540;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px) translate3d(0,0,0);
      transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  visibility 0.3s;
      z-index: 20;
      pointer-events: none; /* Prevents accidental hover when hidden */
    }

    body.day-mode .dropdown-menu {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.15);
    }

    .menu-wrapper:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) translate3d(0,0,0);
    }

    .menu-wrapper:hover .menu-button {
      border-color: #00ffa3;
    }

    body.day-mode .menu-wrapper:hover .menu-button {
      border-color: #0f172a;
    }

    .nav-list {
      list-style: none;
      padding: 6px 0;
    }

    .nav-list li a {
      display: block;
      padding: 8px 12px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.day-mode .nav-list li a {
      color: #0369a1;
    }

    .nav-list li a:hover {
      color: #ffffff;
      background: rgba(0, 255, 163, 0.08);
    }

    body.day-mode .nav-list li a:hover {
      color: #0f172a;
      background: rgba(15, 23, 42, 0.08);
    }

    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      width: 100%;
      max-width: 1400px;
      height: calc(100vh - 55px);
      position: relative;
      z-index: 2;
    }

    .main-title {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
      margin-bottom: -1vh;
      width: 100%;
    }

    .main-title span {
      display: inline-block;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(130px, 30vh, 380px);
      font-weight: 900;
      color: #ffffff;
      line-height: 0.7;
      margin-right: -0.1em;
      
      -webkit-text-stroke: 12px #05080a;
      paint-order: stroke fill;
      
      text-shadow: 
        1px 2px 0px #0e2029,
        3px 6px 0px #05080a,
        6px 10px 0px #00ffa3,
        8px 14px 22px rgba(0, 0, 0, 0.95);

      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.95)) brightness(1);
      position: relative;
      cursor: pointer;
      transform-origin: center bottom;
      
      /* GPU Acceleration & Smoother Beziers */
      will-change: transform, filter, color, text-shadow;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  text-shadow 0.4s ease, 
                  color 0.4s ease, 
                  filter 0.4s ease,
                  -webkit-text-stroke 0.4s ease;
    }

    body.day-mode .main-title span {
      color: #ffffff;
      -webkit-text-stroke: 10px #0f172a;
      paint-order: stroke fill;
      text-shadow: 
        2px 4px 0px #0284c7,
        4px 8px 0px #eab308,
        6px 12px 20px rgba(15, 23, 42, 0.22);
      filter: drop-shadow(0 12px 24px rgba(15, 23, 42, 0.18));
    }

    .main-title span:last-child {
      margin-right: 0;
    }

    .main-title span:hover {
      transform: translate3d(0, -32px, 0) scale(1.2) rotate(-2deg);
      color: #ffffff;
      filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 1)) brightness(1.2);
      text-shadow: 
        1px 2px 0px #0e2029,
        3px 6px 0px #05080a,
        6px 10px 0px #38bdf8;
      z-index: 10;
    }

    body.day-mode .main-title span:hover {
      color: #fef08a;
      -webkit-text-stroke: 10px #031726;
      text-shadow: 
        4px 8px 0px #ca8a04;
      filter: drop-shadow(0 20px 30px rgba(15, 23, 42, 0.3));
    }

    /* ILLUSTRATION WRAPPER WITH ENLARGED OVERLAPPING ICONS */
    .illustration-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 0;
      z-index: 2;
      margin: 10px 0;
    }

    .graphic-item {
      position: relative;
      width: clamp(135px, 20vw, 230px);
      height: clamp(135px, 20vw, 230px);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: transparent;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.85));
      
      /* Overlap adjacent items using negative margins */
      margin: 0 clamp(-38px, -4vw, -20px);
      z-index: 1;

      /* Optimize for animations */
      will-change: transform, filter, z-index;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  filter 0.4s ease, 
                  background 0.4s ease,
                  z-index 0.2s ease;
      
      /* Use a smoother, slightly longer duration for an organic float */
      animation: floatIcon 4.5s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95) alternate;
    }

    .graphic-item:nth-child(1) { z-index: 1; animation-delay: 0s; }
    .graphic-item:nth-child(2) { z-index: 2; animation-delay: 0.9s; }
    .graphic-item:nth-child(3) { z-index: 3; animation-delay: 1.8s; }
    .graphic-item:nth-child(4) { z-index: 4; animation-delay: 2.7s; }

    /* Utilizing translate3d ensures animations run smoothly on the GPU */
    @keyframes floatIcon {
      0% { transform: translate3d(0px, 0px, 0) rotate(0deg); }
      50% { transform: translate3d(-2px, -12px, 0) rotate(1.5deg); }
      100% { transform: translate3d(2px, 6px, 0) rotate(-1.5deg); }
    }

    .graphic-item:hover {
      z-index: 15 !important;
      filter: drop-shadow(0 25px 40px rgba(0, 0, 0, 0.95));
      cursor: pointer;
      /* Replace static transform with dynamic pop and continuous dance animations */
      animation: 
        hoverPopOut 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
        hoverContinuousDance 1.6s ease-in-out 0.5s infinite alternate !important;
    }

    /* Initial energetic pop out */
    @keyframes hoverPopOut {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      40% { transform: translate3d(0, -35px, 0) scale(1.3) rotate(-10deg); }
      70% { transform: translate3d(0, -15px, 0) scale(1.15) rotate(10deg); }
      100% { transform: translate3d(0, -22px, 0) scale(1.2) rotate(0deg); }
    }

    /* Continuous rhythm while hovered */
    @keyframes hoverContinuousDance {
      0% { transform: translate3d(0, -22px, 0) scale(1.2) rotate(0deg); }
      33% { transform: translate3d(0, -28px, 0) scale(1.24) rotate(-6deg); }
      66% { transform: translate3d(0, -16px, 0) scale(1.16) rotate(6deg); }
      100% { transform: translate3d(0, -22px, 0) scale(1.2) rotate(0deg); }
    }

    .graphic-item svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* Prevent internal SVG elements from causing repaints during parent scale */
      transform: translateZ(0); 
    }

    body.day-mode .graphic-item {
      background: transparent;
      filter: drop-shadow(0 12px 22px rgba(15, 23, 42, 0.2));
    }

    body.day-mode .graphic-item:hover {
      filter: drop-shadow(0 18px 30px rgba(15, 23, 42, 0.3));
    }

    /* Smoother SVG transitions */
    .graphic-item svg [stroke], .graphic-item svg [fill] {
      transition: stroke 0.4s ease, fill 0.4s ease;
    }

    body.day-mode .graphic-item svg [stroke="#00ffa3"] { stroke: #0f172a; }
    body.day-mode .graphic-item svg [fill="#00ffa3"] { fill: #0f172a; }
    body.day-mode .graphic-item svg [stroke="#38bdf8"] { stroke: #0284c7; }
    body.day-mode .graphic-item svg [fill="#0284c7"] { fill: #0284c7; }

    /* DANCE ANIMATION FOR "PROCEED FURTHER" HOVER - Smoothed keyframes */
    @keyframes danceIcon {
      0% { transform: translate3d(0px, 0px, 0) rotate(0deg) scale(1); }
      33% { transform: translate3d(0px, -20px, 0) rotate(-12deg) scale(1.08); }
      66% { transform: translate3d(0px, 10px, 0) rotate(10deg) scale(0.94); }
      100% { transform: translate3d(0px, 0px, 0) rotate(0deg) scale(1); }
    }

    body:has(.btn-proceed:hover) .graphic-item {
      animation: danceIcon 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate !important;
    }

    body:has(.btn-proceed:hover) .graphic-item:nth-child(1) { animation-delay: 0s !important; }
    body:has(.btn-proceed:hover) .graphic-item:nth-child(2) { animation-delay: 0.15s !important; }
    body:has(.btn-proceed:hover) .graphic-item:nth-child(3) { animation-delay: 0.3s !important; }
    body:has(.btn-proceed:hover) .graphic-item:nth-child(4) { animation-delay: 0.45s !important; }

    /* SLOW SWAY TOGETHER ANIMATION FOR MENU BUTTON HOVER */
    @keyframes swayTogether {
      0% { transform: translate3d(0, -8px, 0) rotate(-6deg); }
      50% { transform: translate3d(0, 8px, 0) rotate(6deg); }
      100% { transform: translate3d(0, -8px, 0) rotate(-6deg); }
    }

    body:has(.menu-wrapper:hover) .graphic-item {
      animation: swayTogether 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite !important;
    }

    /* PUSHED DOWN TAGLINE LINE */
    .tagline {
      font-size: clamp(16px, 2.3vh, 22px);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.2px;
      margin: clamp(18px, 2.8vh, 32px) 0 clamp(16px, 2.5vh, 26px) 0;
      z-index: 5;
      max-width: 900px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    body.day-mode .tagline {
      color: #0f172a;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    /* PUSHED DOWN PROCEED BUTTON */
    .btn-proceed {
      background: #00ffa3;
      color: #031711;
      font-size: clamp(17px, 2.2vh, 22px);
      font-weight: 900;
      padding: clamp(14px, 2vh, 18px) clamp(40px, 4vw, 56px);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      z-index: 5;
      /* Added will-change for the transform to ensure button scaling is smooth */
      will-change: transform, box-shadow;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  box-shadow 0.3s ease, 
                  background 0.4s ease, 
                  color 0.4s ease,
                  border-color 0.4s ease;
      margin-bottom: 12px;
    }

    body.day-mode .btn-proceed {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-proceed:hover {
      transform: translate3d(0, -4px, 0) scale(1.03);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    body.day-mode .btn-proceed:hover {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.45);
    }

    /* Laser Tracker Overlay */
    #laser-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
    #laser-line {
      stroke: #00ffa3;
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px #00ffa3);
    }
    body.day-mode #laser-line {
      stroke: #ef4444;
      filter: drop-shadow(0 0 6px #ef4444);
    }
  </style>
</head>
<body>

  <!-- Fullscreen laser overlay -->
  <svg id="laser-overlay">
    <line id="laser-line" x1="0" y1="0" x2="0" y2="0" />
  </svg>

  <!-- We use an absolute overlay for day mode to guarantee smooth 60fps color transitions -->
  <div class="day-bg-overlay"></div>
  
  <div class="stars-layer"></div>
  <div class="stars-layer-2"></div>

  <script>
    function setTheme(mode) {
      const dayBtn = document.getElementById('dayBtn');
      const nightBtn = document.getElementById('nightBtn');

      if (mode === 'day') {
        document.body.classList.add('day-mode');
        dayBtn.classList.add('active');
        nightBtn.classList.remove('active');
      } else {
        document.body.classList.remove('day-mode');
        nightBtn.classList.add('active');
        dayBtn.classList.remove('active');
      }
    }

    // Zero-latency instant mouse laser tracking logic
    const laserLine = document.getElementById('laser-line');
    const cameraLens = document.getElementById('drone-camera-lens');

    function updateLaser(e) {
      if (!cameraLens) return;
      const rect = cameraLens.getBoundingClientRect();
      // Center coordinates of the drone camera lens on the screen
      const startX = rect.left + rect.width / 2;
      const startY = rect.top + rect.height / 2;

      laserLine.setAttribute('x1', startX);
      laserLine.setAttribute('y1', startY);
      laserLine.setAttribute('x2', e.clientX);
      laserLine.setAttribute('y2', e.clientY);
    }

    window.addEventListener('mousemove', updateLaser, { passive: true });
    
    // Initial point to avoid flash
    window.addEventListener('load', (e) => {
      updateLaser({ clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 });
    });
  </script>
