<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas — Minimalist Click Quote Engine</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for sleek futuristic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #060709;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --border-glow: rgba(129, 140, 248, 0.4);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        /* Background ambient glow canvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .viewport-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Quote container card with hover fade effect */
        .quote-card {
            position: relative;
            max-width: 900px;
            width: 90%;
            padding: 3.5rem 3rem;
            border-radius: 28px;
            background: rgba(12, 14, 22, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.15s ease-out, border-color 0.4s ease, box-shadow 0.4s ease;
            opacity: 0.92;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* Fade and glow on hover effect */
        .quote-card:hover {
            opacity: 1;
            border-color: rgba(129, 140, 248, 0.4);
            box-shadow: 0 40px 90px -15px rgba(0, 0, 0, 0.8),
                        0 0 50px 0 rgba(99, 102, 241, 0.2),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
        }

        .quote-content {
            font-size: clamp(1.4rem, 3.4vw, 2.6rem);
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: -0.01em;
            word-wrap: break-word;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.35rem 0;
        }

        /* Animated border character box styling */
        .char-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 0.58em;
            height: 1.45em;
            padding: 0 0.14em;
            margin: 0 0.04em;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
            cursor: pointer;
        }

        /* Active typing state for current character */
        .char-box.typing-active {
            border-color: #a5b4fc;
            background: rgba(99, 102, 241, 0.35);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.8), inset 0 0 10px rgba(129, 140, 248, 0.5);
            animation: charPulse 0.3s infinite alternate ease-in-out;
            transform: scale(1.18) translateY(-2px);
            z-index: 10;
        }

        /* Typed character standard border glow */
        .char-box.typed {
            border-color: rgba(255, 255, 255, 0.14);
        }

        /* Hover reaction on character boxes */
        .quote-card:hover .char-box.typed {
            border-color: rgba(129, 140, 248, 0.4);
            background: rgba(99, 102, 241, 0.08);
        }

        .char-box:hover {
            border-color: #a5b4fc !important;
            background: rgba(129, 140, 248, 0.35) !important;
            transform: translateY(-5px) scale(1.22) !important;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5), 0 0 12px rgba(165, 180, 252, 0.8) !important;
            z-index: 20;
        }

        @keyframes charPulse {
            0% {
                border-color: rgba(129, 140, 248, 0.6);
                box-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
            }
            100% {
                border-color: #c7d2fe;
                box-shadow: 0 0 22px rgba(129, 140, 248, 0.9), inset 0 0 12px rgba(129, 140, 248, 0.6);
            }
        }

        /* Ripple shockwave effect on click */
        .ripple {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: rippleExpand 0.85s cubic-bezier(0.1, 0.85, 0.25, 1) forwards;
            background: radial-gradient(circle, rgba(165, 180, 252, 0.5) 0%, rgba(99, 102, 241, 0.2) 40%, transparent 70%);
            border: 1px solid rgba(199, 210, 254, 0.6);
            z-index: 999;
        }

        .spark {
            position: absolute;
            pointer-events: none;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #a5b4fc;
            box-shadow: 0 0 8px #818cf8;
            animation: sparkFly 0.6s ease-out forwards;
            z-index: 1000;
        }

        @keyframes sparkFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0);
            }
        }

        @keyframes rippleExpand {
            0% {
                width: 0px;
                height: 0px;
                opacity: 1;
                border-width: 2px;
            }
            100% {
                width: 800px;
                height: 800px;
                opacity: 0;
                border-width: 1px;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Toast message indicator */
        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(129, 140, 248, 0.4);
            color: #c7d2fe;
            padding: 0.6rem 1.4rem;
            border-radius: 9999px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Fade on hover effect as requested */
        .quote-card:hover {
            opacity: 1;
            transform: translateY(-2px) scale(1.008);
            border-color: rgba(129, 140, 248, 0.3);
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.7),
                        0 0 40px 0 rgba(99, 102, 241, 0.15),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        .quote-content {
            font-size: clamp(1.35rem, 3.2vw, 2.5rem);
            line-height: 1.55;
            font-weight: 400;
            letter-spacing: -0.01em;
            word-wrap: break-word;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.35rem 0;
        }

        .word-wrapper {
            display: inline-flex;
            white-space: nowrap;
            margin-right: 0.3em;
        }

        /* Animated border character box styling */
        .char-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 0.55em;
            height: 1.4em;
            padding: 0 0.12em;
            margin: 0 0.03em;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.015);
            transition: border-color 0.3s ease, background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        /* Active typing state for current character */
        .char-box.typing-active {
            border-color: #818cf8;
            background: rgba(99, 102, 241, 0.25);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.6), inset 0 0 8px rgba(129, 140, 248, 0.4);
            animation: charPulse 0.35s infinite alternate ease-in-out;
            transform: scale(1.12);
            z-index: 2;
        }

        /* Typed character standard border glow */
        .char-box.typed {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Hover reaction on character boxes */
        .quote-card:hover .char-box.typed {
            border-color: rgba(129, 140, 248, 0.35);
            background: rgba(99, 102, 241, 0.06);
        }

        .char-box:hover {
            border-color: #a5b4fc !important;
            background: rgba(129, 140, 248, 0.3) !important;
            transform: translateY(-3px) scale(1.15) !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4) !important;
            z-index: 5;
        }

        @keyframes charPulse {
            0% {
                border-color: rgba(129, 140, 248, 0.5);
                box-shadow: 0 0 5px rgba(99, 102, 241, 0.3);
            }
            100% {
                border-color: #a5b4fc;
                box-shadow: 0 0 18px rgba(129, 140, 248, 0.8), inset 0 0 10px rgba(129, 140, 248, 0.5);
            }
        }

        .meta-container {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease;
        }

        .meta-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .author-box {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #c7d2fe;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .author-dash {
            width: 24px;
            height: 2px;
            background: linear-gradient(90deg, #818cf8, transparent);
            border-radius: 2px;
        }

        .category-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #9ca3af;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: rippleExpand 0.75s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.4) 0%, rgba(99, 102, 241, 0.15) 45%, transparent 70%);
            border: 1px solid rgba(165, 180, 252, 0.5);
            z-index: 999;
        }

        @keyframes rippleExpand {
            0% {
                width: 0px;
                height: 0px;
                opacity: 0.9;
                border-width: 2px;
            }
            100% {
                width: 700px;
                height: 700px;
                opacity: 0;
                border-width: 1px;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Subtle ambient hint at bottom (fades out gracefully) */
        .ambient-hint {
            position: absolute;
            bottom: 2rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s ease;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .hint-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Quote counter index display */
        .quote-counter {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.1em;
        }

        /* Audio indicator pulse */
        .sound-status {
            position: absolute;
            top: 2rem;
            left: 2.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }

        .sound-wave {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #818cf8;
            box-shadow: 0 0 8px #818cf8;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="viewport-wrapper" id="canvas-trigger">
        <div class="sound-status">
            <span class="sound-wave"></span>
            <span>AUDIO ACTIVE</span>
        </div>

        <div class="quote-card" id="quote-card">
            <div class="quote-counter" id="quote-counter">01 / 25</div>
            
            <div class="quote-content" id="quote-text">
                <!-- Character boxes generated dynamically -->
            </div>

            <div class="meta-container" id="meta-container">
                <div class="author-box">
                    <span class="author-dash"></span>
                    <span id="quote-author">Author Name</span>
                </div>
                <div class="category-tag" id="quote-category">Philosophy</div>
            </div>
        </div>

        <div class="ambient-hint" id="ambient-hint">
            <span>Single Click : Next Quote</span>
            <span class="hint-dot"></span>
            <span>Double Click : Previous Quote</span>
            <span class="hint-dot"></span>
            <span>Press 'C' : Copy Quote</span>
        </div>

        <div class="toast" id="toast-notify">QUOTE COPIED TO CLIPBOARD</div>
    </div>

    <script>
        const QUOTES = [
            {
                quote: "Satellites photograph your world every day. Same streets. Same roofs. Again. Again.",
                author: "SCENE 01 — Orbit Tracks",
                category: "Surveillance"
            },
            {
                quote: "Computers compare yesterday and today — floods, fires, new homes. Billions ride on it.",
                author: "SCENE 02 — Comparison Engine",
                category: "Analysis"
            },
            {
                quote: "But it all assumes one thing: the two photos line up perfectly.",
                author: "SCENE 03 — Spatial Lock",
                category: "Assumption"
            },
            {
                quote: "Tilt the camera a hair. Everything shifts. The computer sees change everywhere.",
                author: "SCENE 04 — Perspective Shift",
                category: "Distortion"
            },
            {
                quote: "Like spot-the-difference with misaligned pictures: every single edge screams 'something changed!'",
                author: "SCENE 05 — Edge Noise",
                category: "False Matches"
            },
            {
                quote: "False alarms flood in. Rescue teams chase ghosts. Real disasters wait.",
                author: "SCENE 06 — Operational Impact",
                category: "Consequences"
            },
            {
                quote: "The scary part? The computer never doubts itself. It never says 'maybe.'",
                author: "SCENE 07 — Automation Trap",
                category: "Determinism"
            },
            {
                quote: "You are the checkpoint. No aligned photos, no alarm believed. The gate is yours.",
                author: "SCENE 08 — Safety Gate",
                category: "Human-in-the-Loop"
            },
            {
                quote: "A case just landed. Two photos. One question: do they truly line up?",
                author: "SCENE 09 — Verification Docket",
                category: "Active Case"
            },
            {
                quote: "Soon every place gets photographed hourly. Someone must keep the alarms honest.",
                author: "SCENE 10 — Constant Watch",
                category: "Mission"
            }
        ];

        let currentIndex = 0;
        let isTyping = false;
        let typingTimeoutId = null;
        let clickTimer = null;
        const DOUBLE_CLICK_DELAY = 280;

        /* SECTION: AUDIO SYNTHESIZER ENGINE */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.08) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Audio fallback
            }
        }

        function playChord(baseFreq) {
            if (!audioCtx) return;
            [baseFreq, baseFreq * 1.25, baseFreq * 1.5].forEach((freq, idx) => {
                setTimeout(() => {
                    playTone(freq, 'sine', 0.2, 0.05);
                }, idx * 40);
            });
        }

        /* SECTION: INTERACTIVE RIPPLE AND SPARK EFFECTS */
        const triggerArea = document.getElementById('canvas-trigger');
        const quoteCard = document.getElementById('quote-card');
        const toastEl = document.getElementById('toast-notify');

        function createSparks(x, y) {
            const count = 12;
            for (let i = 0; i < count; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = `${x}px`;
                spark.style.top = `${y}px`;

                const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4);
                const distance = 60 + Math.random() * 80;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                spark.style.setProperty('--dx', `${dx}px`);
                spark.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        function createRipple(e) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            document.body.appendChild(ripple);

            createSparks(e.clientX, e.clientY);

            setTimeout(() => {
                ripple.remove();
            }, 850);
        }

        /* SECTION: CLICK & KEYBOARD EVENT LISTENERS */
        triggerArea.addEventListener('click', (e) => {
            initAudio();
            createRipple(e);

            if (clickTimer !== null) {
                // Double Click -> Previous Quote
                clearTimeout(clickTimer);
                clickTimer = null;
                playChord(350);
                prevQuote();
            } else {
                // Single Click Delay -> Next Quote
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    playChord(520);
                    nextQuote();
                }, DOUBLE_CLICK_DELAY);
            }
        });

        /* 3D Dynamic Card Tilt Tracking */
        window.addEventListener('mousemove', (e) => {
            if (!quoteCard) return;
            const rect = quoteCard.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;

            const rotateX = ((e.clientY - cardCenterY) / (window.innerHeight / 2)) * -6;
            const rotateY = ((e.clientX - cardCenterX) / (window.innerWidth / 2)) * 6;

            quoteCard.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
        });

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowRight' || e.key === ' ') {
                playChord(520);
                nextQuote();
            } else if (e.key === 'ArrowLeft') {
                playChord(350);
                prevQuote();
            } else if (e.key.toLowerCase() === 'c') {
                copyQuoteToClipboard();
            }
        });

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('visible');
            setTimeout(() => {
                toastEl.classList.remove('visible');
            }, 2000);
        }

        function copyQuoteToClipboard() {
            const currentData = QUOTES[currentIndex];
            const textToCopy = `"${currentData.quote}" — ${currentData.author}`;
            
            // Clipboard copy iframe safe fallback
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            playTone(880, 'sine', 0.15, 0.1);
            showToast("QUOTE COPIED TO CLIPBOARD");
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % QUOTES.length;
            renderCurrentQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + QUOTES.length) % QUOTES.length;
            renderCurrentQuote();
        }

        /* SECTION: CHARACTER TYPEWRITER & BORDER ANIMATION */
        const quoteTextEl = document.getElementById('quote-text');
        const quoteAuthorEl = document.getElementById('quote-author');
        const quoteCategoryEl = document.getElementById('quote-category');
        const quoteCounterEl = document.getElementById('quote-counter');
        const metaContainerEl = document.getElementById('meta-container');

        function renderCurrentQuote() {
            if (typingTimeoutId) {
                clearTimeout(typingTimeoutId);
            }

            const currentData = QUOTES[currentIndex];
            
            const formattedIndex = String(currentIndex + 1).padStart(2, '0');
            const formattedTotal = String(QUOTES.length).padStart(2, '0');
            quoteCounterEl.textContent = `${formattedIndex} / ${formattedTotal}`;

            metaContainerEl.classList.remove('visible');
            quoteTextEl.innerHTML = '';

            const words = currentData.quote.split(' ');
            const allCharElements = [];

            words.forEach((wordText) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word-wrapper';

                for (let i = 0; i < wordText.length; i++) {
                    const char = wordText[i];
                    const charBox = document.createElement('span');
                    charBox.className = 'char-box';
                    charBox.textContent = char;
                    charBox.style.visibility = 'hidden';

                    // Hover sound tick on individual character box
                    charBox.addEventListener('mouseenter', () => {
                        playTone(900 + Math.random() * 400, 'sine', 0.03, 0.02);
                    });

                    wordSpan.appendChild(charBox);
                    allCharElements.push(charBox);
                }

                quoteTextEl.appendChild(wordSpan);
            });

            isTyping = true;
            let charIndex = 0;

            function typeNextChar() {
                if (charIndex < allCharElements.length) {
                    if (charIndex > 0) {
                        allCharElements[charIndex - 1].classList.remove('typing-active');
                        allCharElements[charIndex - 1].classList.add('typed');
                    }

                    const currentCharEl = allCharElements[charIndex];
                    currentCharEl.style.visibility = 'visible';
                    currentCharEl.classList.add('typing-active');

                    if (charIndex % 2 === 0) {
                        playTone(1100 + (charIndex * 18), 'sine', 0.02, 0.015);
                    }

                    charIndex++;
                    typingTimeoutId = setTimeout(typeNextChar, 22 + Math.random() * 14);
                } else {
                    if (allCharElements.length > 0) {
                        const lastChar = allCharElements[allCharElements.length - 1];
                        lastChar.classList.remove('typing-active');
                        lastChar.classList.add('typed');
                    }

                    isTyping = false;
                    quoteAuthorEl.textContent = currentData.author;
                    quoteCategoryEl.textContent = currentData.category;
                    metaContainerEl.classList.add('visible');
                }
            }

            typeNextChar();
        }

        /* SECTION: INTERACTIVE PARTICLE CANVAS NETWORK */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.6;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.45 + 0.15;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(129, 140, 248, ${this.alpha})`;
                ctx.fill();
            }
        }

        let particles = [];
        function initParticles() {
            particles = [];
            const count = Math.floor((width * height) / 16000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        let mouseX = width / 2;
        let mouseY = height / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            const gradient = ctx.createRadialGradient(
                mouseX, mouseY, 0,
                mouseX, mouseY, 500
            );
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.09)');
            gradient.addColorStop(0.5, 'rgba(30, 27, 75, 0.03)');
            gradient.addColorStop(1, 'rgba(6, 7, 9, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Connect nearby particles with delicate laser lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 90) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(129, 140, 248, ${0.12 * (1 - dist / 90)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateCanvas);
        }

        window.onload = function() {
            initParticles();
            animateCanvas();
            renderCurrentQuote();

            setTimeout(() => {
                const hint = document.getElementById('ambient-hint');
                if (hint) {
                    hint.style.opacity = '0.35';
                }
            }, 6000);
        };
    </script>
</body>
