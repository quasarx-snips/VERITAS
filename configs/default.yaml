# Phase 3C default backend configuration. Values are operational defaults;
# verdict thresholds remain provisional and require future calibration.
detectors:
  sift: {n_features: 6000, contrast_threshold: 0.01, edge_threshold: 15.0}
  orb: {n_features: 2000, scale_factor: 1.2, n_levels: 8}
  akaze: {threshold: 0.001}
matching:
  method: BF
  ratio: 0.75
  knn_k: 2
  mutual_consistency: false
  unique_train_matches: true
geometry:
  model: affine
  reprojection_threshold: 3.0
  min_inliers: 4
spatial:
  grid_shape: [4, 4]
counter_evidence: {}
partial_correspondence:
  grid_shape: [4, 4]
  min_inliers_per_region: 3
  min_inlier_ratio_per_region: 0.3
gate_policy:
  STRONG: ALLOW
  PARTIAL: RESTRICT
  WEAK: HUMAN_REVIEW
  NONE: BLOCK
